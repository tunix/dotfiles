- name: Download AWS Session Manager Plugin RPM
  get_url:
    url: "{{ aws.session_manager_plugin.url }}"
    dest: /tmp/session-manager-plugin.rpm
    mode: '0644'

- name: Ensure local bin directory exists
  file:
    path: "{{ ansible_facts.user_dir }}/.local/bin"
    state: directory
    mode: '0755'

- name: Install AWS Session Manager Plugin from RPM
  # Extracts the plugin binary straight from the RPM cpio payload with
  # plain Python — no rpm2cpio/cpio required on the target system.
  script:
    cmd: >-
      extract_rpm.py /tmp/session-manager-plugin.rpm
      usr/local/sessionmanagerplugin/bin/session-manager-plugin
      "{{ ansible_facts.user_dir }}/.local/bin/session-manager-plugin"
    creates: "{{ ansible_facts.user_dir }}/.local/bin/session-manager-plugin"