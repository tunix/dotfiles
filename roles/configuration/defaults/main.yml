configure:
  maven: false

abbrs:
  rm: rm -i
  lc: wc -l
  port: lsof -i

terminal:
  app: ghostty
  multiplexer: zellij
  window:
    width: 160
    height: 42
    opacity: 0.95
    blur: true
    decorations: "TITLE | RESIZE"
  font:
    size: 11
    face: JetBrains Mono
  colors:
    ghostty:
      light: Catppuccin Latte
      dark: Catppuccin Frappe
    zellij:
      light: catppuccin-latte
      dark: catppuccin-frappe
    k9s:
      light: catppuccin-latte
      dark: catppuccin-frappe
    bat:
      light: Catppuccin Latte
      dark: Catppuccin Frappe

shell:
  bin: /usr/bin/fish
  args: -l
  # user dirs — rendered into ~/.config/environment.d/10-path.conf (start of PATH)
  path: ~/.local/bin
  # homebrew prefix; its bin/sbin go after user dirs. Empty disables brew entries
  brew_prefix: ''
  # system dirs, always last — rendered into ~/.config/environment.d/30-path-system.conf
  system_path: /usr/local/sbin /usr/local/bin /usr/sbin /usr/bin /sbin /bin

editor:
  name: nvim
  colors:
    lazyvim:
      light: catppuccin-latte
      dark: catppuccin-frappe

onepassword:
  enabled: false

ghostty:
  config_path: .config/ghostty

opencode:
  # Default model: OpenRouter GLM. The VM Hermes agent (pi5.local hermes
  # container, OpenAI-compatible API server, port 8642) remains selectable
  # under providers (/models); credentials live in the auth store
  # (`opencode auth`/credential table); 1Password item: "Hermes API Server"
  # (op://Private/Hermes API Server/credential).
  model: openrouter/z-ai/glm-5.3-flash

  providers:
    hermes:
      name: Hermes
      package: "@opencode/ai/providers/openai-compatible"
      settings:
        baseURL: "http://192.168.68.62:8642/v1"
      models:
        hermes-agent:
          name: "Hermes Agent (VM default)"
          body:
            model_options:
              reasoning_effort: high
        glm-5.3-flash:
          name: "Hermes Agent (GLM 5.3 Flash)"
          modelID: "z-ai/glm-5.3-flash"
          body:
            model_options:
              reasoning_effort: high
        claude-opus-5.5:
          name: "Hermes Agent (Claude Opus 5.5)"
          modelID: "anthropic/claude-opus-5.5"
          body:
            model_options:
              reasoning_effort: high
        claude-sonnet-5.5:
          name: "Hermes Agent (Claude Sonnet 5.5)"
          modelID: "anthropic/claude-sonnet-5.5"
          body:
            model_options:
              reasoning_effort: high
        grok-4.7:
          name: "Hermes Agent (Grok 4.7)"
          modelID: "x-ai/grok-4.7"
          body:
            model_options:
              reasoning_effort: high
        gpt-6.1-sol:
          name: "Hermes Agent (GPT 6.1 Sol)"
          modelID: "openai/gpt-6.1-sol"
          body:
            model_options:
              reasoning_effort: high

  mcp:
    # PAT is supplied via the environment ({env:...}). The `oc` alias launches
    # opencode through `op run --no-masking --env-file ~/.config/opencode/.env`,
    # which resolves the 1Password secret references into env vars for the
    # process only. --no-masking keeps the TTY intact; without it op run pipes
    # stdout/stderr for secret masking and opencode's TUI renders broken/blank.
    github:
      disabled: false
      type: remote
      url: https://api.githubcopilot.com/mcp/
      oauth: false
      headers:
        Authorization: "Bearer {env:GITHUB_PERSONAL_ACCESS_TOKEN}"
    context7:
      disabled: false
      type: remote
      url: https://mcp.context7.com/mcp
    # TCMB EVDS (economic time series). Uses OAuth: during connection the
    # EVDS API key is entered in the browser ("Verify and Sign In"); the key
    # lives in the OAuth identity store, not in the config.
    tcmb:
      disabled: false
      type: remote
      url: https://mcp.tcmb.gov.tr/tcmb-mcp/evds/mcp

  references:
    # Git repo references — OpenCode clones/pulls them itself; type "@plans"
    # in the TUI to add the repo to the prompt. Repo-based (not path) so it
    # works on every machine.
    #
    # Must use the SSH remote form: the repo is private and there is no git
    # credential helper, so the "owner/repo" shorthand (cloned over HTTPS)
    # fails non-interactively with "could not read Username". SSH is
    # authenticated via the 1Password agent on every machine (same pattern
    # as the work submodule).
    plans:
      repository: "git@github.com:tunix/plans.git"
      branch: "main"

  cli:
    keybinds: {}
    attention:
      notifications: true
      sound: true
      volume: 1
    session:
      scrollbar: true
      sidebar: hide
    animations: true
    tabs:
      layout: horizontal
    scroll:
      speed: 1
