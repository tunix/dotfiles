configure:
  maven: false

abbrs:
  rm: rm -i
  lc: wc -l
  port: lsof -i

terminal:
  app: ghostty
  multiplexer: zellij
  window:
    width: 160
    height: 42
    opacity: 0.95
    blur: true
    decorations: "TITLE | RESIZE"
  font:
    size: 11
    face: JetBrains Mono
  colors:
    ghostty:
      light: Catppuccin Latte
      dark: Catppuccin Frappe
    zellij:
      light: catppuccin-latte
      dark: catppuccin-frappe
    k9s:
      light: catppuccin-latte
      dark: catppuccin-frappe
    bat:
      light: Catppuccin Latte
      dark: Catppuccin Frappe

shell:
  bin: /usr/bin/fish
  args: -l
  path: ~/.cargo/bin ~/.krew/bin

editor:
  name: nvim
  colors:
    lazyvim:
      light: catppuccin-latte
      dark: catppuccin-frappe

onepassword:
  enabled: false

ghostty:
  config_path: .config/ghostty

opencode:
  mcp:
    # PAT is supplied via the environment ({env:...}); export
    # GITHUB_PERSONAL_ACCESS_TOKEN in your shell before starting opencode.
    github:
      disabled: false
      type: remote
      url: https://api.githubcopilot.com/mcp/
      oauth: false
      headers:
        Authorization: "Bearer {env:GITHUB_PERSONAL_ACCESS_TOKEN}"
    context7:
      disabled: false
      type: remote
      url: https://mcp.context7.com/mcp

  cli:
    keybinds: {}
    attention:
      notifications: true
      sound: true
      volume: 1
    session:
      scrollbar: true
      sidebar: hide
    animations: true
    tabs:
      layout: horizontal
    scroll:
      speed: 1
