- name: Create environment.d directory
  file:
    path: "{{ ansible_facts.user_dir }}/.config/environment.d"
    state: directory
    mode: 0700

- name: Render PATH environment file
  template:
    src: environment.d/10-path.conf.j2
    dest: "{{ ansible_facts.user_dir }}/.config/environment.d/10-path.conf"

- name: Render system PATH environment file
  template:
    src: environment.d/30-path-system.conf.j2
    dest: "{{ ansible_facts.user_dir }}/.config/environment.d/30-path-system.conf"
