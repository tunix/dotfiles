- name: Ensure opencode config directory exists
  file:
    path: "{{ ansible_facts.user_dir }}/.config/opencode"
    state: directory

- name: Remove legacy opencode TUI config
  file:
    path: "{{ ansible_facts.user_dir }}/.config/opencode/{{ item }}"
    state: absent
  loop:
    - tui.json
    - tui.jsonc

- name: Configure opencode
  template:
    src: opencode/opencode.jsonc.j2
    dest: "{{ ansible_facts.user_dir }}/.config/opencode/opencode.jsonc"

- name: Configure opencode terminal client
  template:
    src: opencode/cli.json.j2
    dest: "{{ ansible_facts.user_dir }}/.config/opencode/cli.json"

- name: Place opencode secret references
  copy:
    src: "{{ role_path }}/files/opencode/.env"
    dest: "{{ ansible_facts.user_dir }}/.config/opencode/.env"
    mode: "0600"

# OpenCode loads ~/.config/opencode/AGENTS.md in every project, ahead of
# each repository's own AGENTS.md.
- name: Place opencode global agent rules
  copy:
    src: "{{ role_path }}/files/opencode/AGENTS.md"
    dest: "{{ ansible_facts.user_dir }}/.config/opencode/AGENTS.md"
