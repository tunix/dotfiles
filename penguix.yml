- hosts: localhost

  vars:
    aliases:
      # --no-masking is required: without it op run pipes stdout/stderr
      # (for secret masking) and opencode's TUI renders broken/blank
      oc: "op run --no-masking --env-file=$HOME/.config/opencode/.env -- opencode"
      v: nvim

    abbrs:
      pengudroid: scrcpy -eS --always-on-top --power-off-on-close

    terminal:
      window:
        width: 184
        height: 52

    shell:
      # user dirs first, homebrew next; system dirs stay last (brew doctor)
      path: ~/.local/bin ~/.cargo/bin ~/.krew/bin /home/linuxbrew/.linuxbrew/bin /home/linuxbrew/.linuxbrew/sbin
      brew_prefix: /home/linuxbrew/.linuxbrew

    # GNOME extensions: add only extensions NOT already shipped by the
    # penguix image system-wide (/usr/share/gnome-shell/extensions). Empty
    # for now — the image provides everything we use. Role defaults keep
    # gnome.extensions.{install,enabled,disabled} empty.
  roles:
    - linux
    - gnome
    - configuration
    - work
