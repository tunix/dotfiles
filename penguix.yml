- hosts: localhost

  vars:
    configure:
      maven: true

    work:
      midas: true

    aliases:
      # --no-masking is required: without it op run pipes stdout/stderr
      # (for secret masking) and opencode's TUI renders broken/blank
      oc: "op run --no-masking --env-file=$HOME/.config/opencode/.env -- opencode"
      v: nvim

    abbrs:
      pengudroid: scrcpy -eS --always-on-top --power-off-on-close

    terminal:
      window:
        width: 160
        height: 42

    # GNOME extensions are not installed here: the penguix image ships them
    # system-wide (/usr/share/gnome-shell/extensions). Role defaults keep
    # gnome.extensions.{install,enabled,disabled} empty.
  roles:
    - linux
    - gnome
    - configuration
    - work
